/* ========== 画像プリロード基盤 ========== */
const $=id=>document.getElementById(id);
const keep=[];              // Image オブジェクトを保持（GCされてキャッシュが消えるのを防ぐ）
const loaded={};            // url -> Promise<boolean>（同じ画像は1回しか取りに行かない）
function load(u){
  if(loaded[u])return loaded[u];
  return loaded[u]=new Promise(res=>{
    const i=new Image();
    i.decoding='async';
    i.onload=()=>{(i.decode?i.decode():Promise.resolve()).catch(()=>{}).then(()=>res(true))};
    i.onerror=()=>res(false);
    i.src=u;
    keep.push(i);
  });
}
const idle=f=>('requestIdleCallback' in window)?requestIdleCallback(f,{timeout:1500}):setTimeout(f,200);

/* ========== 背景スライドショー（2秒毎・枚数は自動検出） ========== */
let bgTimer,bgToken=0;
const BG_MAX=30;
const bgUrl=(id,i)=>`images/${id}-${i}.png`;
const bgState={};
/* 1枚目は単独で最優先、2枚目以降は4枚ずつ並列で調べ、見つかった順にすぐ使えるようにする */
function discover(id){
  if(bgState[id])return bgState[id];
  const st=bgState[id]={urls:[],done:false};
  let ready;st.ready=new Promise(r=>ready=r);
  st.p=(async()=>{
    let s=1,B=1;
    while(s<=BG_MAX&&!st.done){
      const idx=[];for(let i=s;i<s+B&&i<=BG_MAX;i++)idx.push(i);
      const res=await Promise.all(idx.map(i=>load(bgUrl(id,i))));
      for(let k=0;k<res.length;k++){
        if(!res[k]){st.done=true;break}
        st.urls.push(bgUrl(id,idx[k]));
      }
      if(s===1)ready();
      s+=B;B=4;
    }
    st.done=true;ready();
  })();
  return st;
}
async function slideshow(id){
  clearInterval(bgTimer);
  const el=$('bg');el.innerHTML='';
  const token=++bgToken;
  const st=discover(id);
  await st.ready;                              // 1枚目が届き次第すぐ表示
  if(token!==bgToken||!st.urls.length)return;  // 画面遷移済み／画像なしなら中止
  const els=[];
  const sync=()=>{while(els.length<st.urls.length){
    const d=document.createElement('i');d.style.backgroundImage=`url(${st.urls[els.length]})`;
    el.appendChild(d);els.push(d)}};
  sync();els[0].classList.add('on');
  let n=0;
  bgTimer=setInterval(()=>{
    sync();                                    // 後から見つかった画像を順次追加
    if(els.length<2)return;
    els[n].classList.remove('on');n=(n+1)%els.length;els[n].classList.add('on');
  },2000);
}

/* ========== 先読み ========== */
function prefetch(id){
  if(SHOPS[id]){
    load(`images/logo-${id}.png`);
    [1,2,3].forEach(i=>load(`images/${id}-food-${i}.png`));
  }else if(T[id]){
    discover(id);                              // 背景の1枚目＋連番検出を先に進めておく
  }
}
const prefetchChildren=id=>(T[id]||[]).forEach(prefetch);

/* ========== 画面遷移 ========== */
const stack=['root'];
function go(id){stack.push(id);show()}
$('back').onclick=()=>{if(stack.length>1){stack.pop();show()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});

function show(){
  const id=stack[stack.length-1];
  prefetch(id);                                // フェードアウト中から読み込み開始
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $('back').style.display=stack.length>1?'block':'none';
  setTimeout(()=>{
    clearInterval(window.sliderTimer);let s;
    if(id==='root')s='s-top';
    else if(SHOPS[id]){s='s-shop';renderShop(id)}
    else{s='s-menu';renderMenu(id)}
    $(s).scrollTop=0;updateText();$(s).classList.add('on');
    if(s==='s-shop')kickVideo();
    idle(()=>prefetchChildren(id));            // 次に進みそうな先を先読み
  },250);
}
function renderMenu(id){
  $('menu').innerHTML=T[id].map(c=>`<button data-go="${c}" data-n="${c}"></button>`).join('');
  slideshow(id);
}
function renderShop(id){
  const d=SHOPS[id],base=id;
  $('shop').innerHTML=`
  <div class="head"><img src="images/logo-${base}.png" alt="" decoding="async" fetchpriority="high">
    <div><h1>${d.title}<br>RESTAURANT YOSAKURA</h1><p data-sn="${id}"></p></div></div>
  <div class="info"><div class="area" data-n="${id}"></div>
    <div class="open"><span data-u="open"></span> | ${d.hours}</div>
    <span data-sa="${id}"></span><br>${d.tel}</div>
  <div class="vwrap" id="vwrap"><button class="vplay" id="vplay" aria-label="play">▶</button></div>
  <div class="slider" id="slider">${[1,2,3].map(i=>`<img src="images/${base}-food-${i}.png" alt="" loading="eager" decoding="async" fetchpriority="high">`).join('')}</div>
  <div class="offer"><small data-u="special"></small><br><span class="pct">10<small>%</small> OFF</span><br>
    <small data-u="coupon"></small><br><span class="code">${d.code}</span>
    <button class="copy" id="copy" data-u="copy"></button>
    <p data-u="note"></p></div>
  <a class="resv" href="${d.url}" target="_blank" rel="noopener" data-u="reserve"></a>`;
  mountVideo(id);
  $('copy').onclick=async()=>{
    try{await navigator.clipboard.writeText(d.code)}catch(e){const t=document.createElement('textarea');t.value=d.code;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
    const b=$('copy');b.dataset.u='copied';updateText();
    setTimeout(()=>{b.dataset.u='copy';updateText()},1600);
  };
}

/* ========== 動画（全ブラウザ対応の自動再生） ========== */
function kickVideo(){
  const v=document.querySelector('#vwrap video'),btn=$('vplay');
  if(!v||!v.paused)return;
  v.muted=true;
  const p=v.play();
  if(p&&p.catch)p.catch(()=>{if(btn&&v.paused)btn.style.display='flex'});
}
function mountVideo(id){
  const wrap=$('vwrap'),btn=$('vplay');
  const srcs=[`images/${id}.mp4`];
  let i=0;
  const v=document.createElement('video');
  v.muted=true;v.defaultMuted=true;v.loop=true;v.autoplay=true;v.controls=false;
  v.playsInline=true;v.preload='auto';v.disablePictureInPicture=true;
  ['muted','playsinline','webkit-playsinline','x5-playsinline'].forEach(a=>v.setAttribute(a,''));
  v.addEventListener('playing',()=>{btn.style.display='none'});
  v.addEventListener('loadeddata',kickVideo);
  v.addEventListener('canplay',kickVideo);
  v.addEventListener('error',()=>{
    i++;
    if(i<srcs.length){v.src=srcs[i];v.load()}
    else console.warn('動画を読み込めません:',srcs.join(' / '));
  });
  btn.onclick=()=>{v.muted=true;v.play().then(()=>{btn.style.display='none'}).catch(()=>{})};
  wrap.insertBefore(v,btn);
  v.src=srcs[0];v.load();
}
/* 自動再生がブロックされた環境（省電力モード等）では最初のタップ／スクロールで再生 */
['click','touchstart','keydown','scroll'].forEach(ev=>document.addEventListener(ev,()=>kickVideo(),{passive:true,capture:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)kickVideo()});

/* ========== 言語切替（即時反映） ========== */
function updateText(){
  document.querySelectorAll('[data-n]').forEach(e=>e.textContent=nm(e.dataset.n));
  document.querySelectorAll('[data-sn]').forEach(e=>e.textContent=SHOPS[e.dataset.sn].name[lang]);
  document.querySelectorAll('[data-sa]').forEach(e=>e.innerHTML=SHOPS[e.dataset.sa].addr[lang].join('<br>'));
  document.querySelectorAll('[data-u]').forEach(e=>e.textContent=UI[e.dataset.u][lang]);
  $('back').textContent=UI.back[lang];
  document.documentElement.lang=LANGS[lang][0];
}
$('lang').innerHTML=LANGS.map((l,i)=>`<button data-i="${i}">${l[1]}</button>`).join('');
$('lang').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  lang=+b.dataset.i;
  document.querySelectorAll('#lang button').forEach(x=>x.classList.toggle('on',x===b));
  updateText();
};
$('lang').children[0].classList.add('on');
updateText();$('s-top').classList.add('on');

/* トップ表示後、アイドル時間に日本/ベトナムと各エリアの背景1枚目を先読み */
idle(()=>{
  prefetchChildren('root');
  idle(()=>{prefetchChildren('japan');prefetchChildren('vietnam')});
});
</script>
