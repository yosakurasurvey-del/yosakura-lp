<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YOSAKURA</title>
<link rel="icon" type="image/png" href="images/main-logo.png">
<link rel="apple-touch-icon" href="images/main-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Shippori Mincho','Times New Roman',serif;color:#111;background:#fff;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.lang{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:2px;padding:4px;border-radius:20px;background:rgba(255,255,255,.85);font-size:12px;white-space:nowrap}
.lang button{padding:5px 10px;border-radius:14px;color:#555}
.lang button.on{background:#111;color:#fff}
.back{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:16px;z-index:30;font-size:13px;letter-spacing:.1em;padding:6px 10px;background:rgba(255,255,255,.85);border-radius:14px;display:none}
.screen{position:absolute;inset:0;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.screen.on{opacity:1;visibility:visible}
.menu{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(36px,9vh,80px);padding:90px 20px}
.menu button{font-size:clamp(22px,5.5vw,32px);letter-spacing:.18em}
#s-top .menu{gap:clamp(26px,5vh,44px)}
#s-top img{width:min(160px,40vw);margin-bottom:0}
#s-menu{background:#000;color:#fff}
#s-menu .menu button{font-size:clamp(18px,4.5vw,26px);letter-spacing:.14em;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.bg{position:absolute;inset:0;z-index:0;background:#111}
.bg i{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity .6s}
.bg i.on{opacity:1}
.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.4)}
/* promo */
.shop{max-width:760px;min-height:100%;margin:0 auto;padding:90px 24px;display:flex;flex-direction:column;justify-content:center}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.head img{height:56px;max-width:45%;object-fit:contain}
.head div{text-align:right;letter-spacing:.14em}
.head h1{font-weight:400;font-size:clamp(18px,4.5vw,28px);line-height:1.5}
.head p{margin-top:18px;font-size:clamp(13px,3vw,17px)}
.info{margin:46px 0 32px;line-height:2;letter-spacing:.06em;font-size:clamp(12px,2.8vw,15px)}
.info .open{font-size:clamp(17px,4vw,22px);letter-spacing:.1em}
.info .area{font-size:12px;color:#777}
video{width:100%;aspect-ratio:16/9;object-fit:cover;background:#222;display:block}
.slider{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:16px;scrollbar-width:none}
.slider::-webkit-scrollbar{display:none}
.slider img{flex:0 0 82%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:start;background:#ddd}
@media(min-width:600px){.slider img{flex-basis:calc((100% - 32px)/3)}}
.offer{margin-top:48px;background:#4d1f00;color:#fff;text-align:center;padding:40px 20px;letter-spacing:.1em}
.offer small{font-size:12px}
.offer .pct{display:inline-block;margin:12px 0;padding:6px 26px;border:solid #fff;border-width:1px 0;font-size:34px}
.offer .code{display:inline-block;margin:10px 0 16px;padding:12px 30px;background:#fff;color:#111}
.offer .copy{display:block;margin:0 auto 14px;font-size:12px;color:#fff}
.offer p{font-size:12px;line-height:1.9}
.resv{display:block;width:fit-content;margin:36px auto 0;padding:16px 40px;background:#000;color:#fff;text-decoration:none;text-align:center;font-size:13px;letter-spacing:.14em}
</style>
</head>
<body>
<div class="lang" id="lang"></div>
<button class="back" id="back">← BACK</button>

<section class="screen" id="s-top">
  <div class="menu">
    <img src="images/main-logo.png" alt="YOSAKURA">
    <button data-n="japan" data-go="japan"></button>
    <button data-n="vietnam" data-go="vietnam"></button>
  </div>
</section>

<section class="screen" id="s-menu">
  <div class="bg" id="bg"></div>
  <div class="menu" id="menu"></div>
</section>

<section class="screen" id="s-shop"><div class="shop" id="shop"></div></section>

<script>
/* ========== 多言語 (en / ja / ko / vi) ========== */
const LANGS=[['en','English'],['ja','日本語'],['ko','한국어'],['vi','Tiếng Việt']];
const UI={
  special:['SPECIAL OFFER','特別オファー','특별 혜택','ƯU ĐÃI ĐẶC BIỆT'],
  coupon:['COUPON CODE','クーポンコード','쿠폰 코드','MÃ GIẢM GIÁ'],
  copy:['[ COPY CODE ]','［ コードをコピー ］','[ 코드 복사 ]','[ SAO CHÉP MÃ ]'],
  copied:['COPIED!','コピーしました','복사되었습니다','ĐÃ SAO CHÉP!'],
  note:['Copy this code and enter it during your reservation.','このコードをコピーして予約時に入力してください。','이 코드를 복사하여 예약 시 입력해 주세요.','Sao chép mã này và nhập khi đặt bàn.'],
  reserve:['MAKE A RESERVATION','ご予約はこちらから','예약하기','ĐẶT BÀN NGAY'],
  open:['OPEN','営業時間','영업시간','GIỜ MỞ CỬA'],
  back:['← BACK','← 戻る','← 뒤로','← QUAY LẠI']
};
const N={ // [en, ja, ko, vi]
  japan:['JAPAN','日本','일본','NHẬT BẢN'],vietnam:['VIETNAM','ベトナム','베트남','VIỆT NAM'],
  osaka:['OSAKA','大阪','오사카','OSAKA'],kyoto:['KYOTO','京都','교토','KYOTO'],tokyo:['TOKYO','東京','도쿄','TOKYO'],
  yamanashi:['YAMANASHI','山梨','야마나시','YAMANASHI'],hiroshima:['HIROSHIMA','広島','히로시마','HIROSHIMA'],
  hanoi:['Ha Noi','ハノイ','하노이','Hà Nội'],hochiminh:['Ho Chi Minh','ホーチミン','호치민','Hồ Chí Minh'],
  namba:['Namba','難波','난바','Namba'],shinsaibashi:['Shinsaibashi','心斎橋','신사이바시','Shinsaibashi'],
  nagahoribashi:['Nagahoribashi','長堀橋','나가호리바시','Nagahoribashi'],
  gion:['Gion','祇園','기온','Gion'],asakusabashi:['Asakusabashi','浅草橋','아사쿠사바시','Asakusabashi'],
  fujiyoshida_unagi:['Fujiyoshida / Japanese Eel','Fujiyoshida / 日本鰻','후지요시다 / 일본 장어','Fujiyoshida / Lươn Nhật'],
  fujiyoshida_wagyu:['Fujiyoshida / Wagyu Katsu','Fujiyoshida / 和牛カツ','후지요시다 / 와규 카츠','Fujiyoshida / Wagyu Katsu']
};
let lang=0;
const nm=id=>(N[id]||N[id.replace('_shop','')])[lang];

/* ========== 画面ツリー ========== */
const T={
  root:['japan','vietnam'],
  japan:['osaka','kyoto','tokyo','yamanashi','hiroshima'],
  vietnam:['hanoi','hochiminh'],
  osaka:['namba','shinsaibashi','nagahoribashi'],
  kyoto:['gion'],tokyo:['asakusabashi'],
  yamanashi:['fujiyoshida_unagi','fujiyoshida_wagyu'],
  hiroshima:['hiroshima_shop'],hanoi:['hanoi_shop'],hochiminh:['hochiminh_shop']
};
T.kyoto=['gion'];

/* ========== 店舗データ（住所・TEL・クーポン・予約URLは店舗ごとに差し替え） ========== */
const S=(title,code,url,addr,tel,area)=>({title,code,url,addr,tel,area,hours:'18:00-22:00'});
const PH=['(Address line 1)','(Address line 2)','(Address line 3)'];
const SHOPS={
  namba:S('OMAKASE','YOSAKURA-NAMBA','https://example.com/reserve/namba',PH,'TEL 00-0000-0000'),
  shinsaibashi:S('OMAKASE','YOSAKURA10','https://example.com/reserve/shinsaibashi',
    ['1F, Rearino Higashi Shinsaibashi Building','1-4-21 Higashi Shinsaibashi, Chuo-ku','Osaka-shi, Osaka 542-0083'],'TEL 06-6210-4391'),
  nagahoribashi:S('OMAKASE','YOSAKURA-NAGAHORI','https://example.com/reserve/nagahoribashi',PH,'TEL 00-0000-0000'),
  gion:S('OMAKASE','YOSAKURA-GION','https://example.com/reserve/gion',PH,'TEL 00-0000-0000'),
  asakusabashi:S('UNAGI','YOSAKURA-ASAKUSA','https://example.com/reserve/asakusabashi',PH,'TEL 00-0000-0000'),
  fujiyoshida_unagi:S('UNAGI','YOSAKURA-UNAGI','https://example.com/reserve/fujiyoshida-unagi',PH,'TEL 00-0000-0000'),
  fujiyoshida_wagyu:S('WAGYU KATSU','YOSAKURA-WAGYU','https://example.com/reserve/fujiyoshida-wagyu',PH,'TEL 00-0000-0000'),
  hiroshima_shop:S('OMAKASE','YOSAKURA-HIRO','https://example.com/reserve/hiroshima',PH,'TEL 00-0000-0000'),
  hanoi_shop:S('OMAKASE','YOSAKURA-HANOI','https://example.com/reserve/hanoi',PH,'TEL 00-0000-0000'),
  hochiminh_shop:S('OMAKASE','YOSAKURA-HCM','https://example.com/reserve/hochiminh',PH,'TEL 00-0000-0000')
};

/* ========== 背景スライドショー（1.2秒毎） ========== */
let bgTimer,sliderTimer;
function slideshow(id){
  clearInterval(bgTimer);
  const el=document.getElementById('bg');el.innerHTML='';
  const im=[1,2,3,4,5].map(i=>{const d=document.createElement('i');d.style.backgroundImage=`url(images/${id}-${i}.png)`;el.appendChild(d);return d});
  let n=0;im[0].classList.add('on');
  bgTimer=setInterval(()=>{im[n].classList.remove('on');n=(n+1)%im.length;im[n].classList.add('on')},1200);
}

/* ========== 画面遷移 ========== */
const stack=['root'];
const $=id=>document.getElementById(id);
function go(id){stack.push(id);show()}
$('back').onclick=()=>{if(stack.length>1){stack.pop();show()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});

function show(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $('back').style.display=stack.length>1?'block':'none';
  setTimeout(()=>{
    const id=stack[stack.length-1];clearInterval(sliderTimer);let s;
    if(id==='root')s='s-top';
    else if(SHOPS[id]){s='s-shop';renderShop(id)}
    else{s='s-menu';renderMenu(id)}
    $(s).scrollTop=0;updateText();$(s).classList.add('on');
  },360);
}
function renderMenu(id){
  $('menu').innerHTML=T[id].map(c=>`<button data-go="${c}" data-n="${c}"></button>`).join('');
  slideshow(id);
}
function renderShop(id){
  const d=SHOPS[id],base=id;
  $('shop').innerHTML=`
  <div class="head"><img src="images/logo-${base}.png" alt="">
    <div><h1>${d.title}<br>RESTAURANT YOSAKURA</h1><p>日本料理世桜</p></div></div>
  <div class="info"><div class="area" data-n="${id}"></div>
    <div class="open"><span data-u="open"></span> | ${d.hours}</div>
    ${d.addr.join('<br>')}<br>${d.tel}</div>
  <video src="images/video/${base}.mp4" autoplay muted loop playsinline></video>
  <div class="slider" id="slider">${[1,2,3].map(i=>`<img src="images/${base}-food-${i}.png" alt="">`).join('')}</div>
  <div class="offer"><small data-u="special"></small><br><span class="pct">10<small>%</small> OFF</span><br>
    <small data-u="coupon"></small><br><span class="code">${d.code}</span>
    <button class="copy" id="copy" data-u="copy"></button>
    <p data-u="note"></p></div>
  <a class="resv" href="${d.url}" target="_blank" rel="noopener" data-u="reserve"></a>`;
  $('copy').onclick=async()=>{
    try{await navigator.clipboard.writeText(d.code)}catch(e){const t=document.createElement('textarea');t.value=d.code;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
    const b=$('copy');b.dataset.u='copied';updateText();
    setTimeout(()=>{b.dataset.u='copy';updateText()},1600);
  };
  const sl=$('slider');
  sliderTimer=setInterval(()=>{
    const w=sl.firstElementChild.offsetWidth+16;
    if(sl.scrollLeft+sl.clientWidth>=sl.scrollWidth-4)sl.scrollTo({left:0,behavior:'smooth'});
    else sl.scrollBy({left:w,behavior:'smooth'});
  },3000);
}

/* ========== 言語切替（即時反映） ========== */
function updateText(){
  document.querySelectorAll('[data-n]').forEach(e=>e.textContent=nm(e.dataset.n));
  document.querySelectorAll('[data-u]').forEach(e=>e.textContent=UI[e.dataset.u][lang]);
  $('back').textContent=UI.back[lang];
  document.documentElement.lang=LANGS[lang][0];
}
$('lang').innerHTML=LANGS.map((l,i)=>`<button data-i="${i}">${l[1]}</button>`).join('');
$('lang').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  lang=+b.dataset.i;
  document.querySelectorAll('#lang button').forEach(x=>x.classList.toggle('on',x===b));
  updateText();
};
$('lang').children[0].classList.add('on');
updateText();$('s-top').classList.add('on');
</script>
</body>
</html>
